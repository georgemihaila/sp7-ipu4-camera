# Preserve RPM Fusion's OBS virtual camera and add the two named RGB Surface
# Camera endpoints.
#
# Surface Camera (front) is the OV5693 and Surface Camera (back) is the OV8865.
# The IR endpoint is an opt-in standalone source-6 producer, not a bridge
# controller camera.
options v4l2loopback devices=4 video_nr=55,60,61,62 card_label="OBS Virtual Camera,Surface Camera (front),Surface Camera (back),Surface Camera (IR)" exclusive_caps=1,1,1,1
