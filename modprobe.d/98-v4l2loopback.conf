# Preserve RPM Fusion's OBS virtual camera and add the two named Surface
# Camera endpoints.
#
# Surface Camera (front) is the OV5693 and Surface Camera (back) is the OV8865.
# The bridge starts only the sensor whose virtual device is open because both
# sensors share the IPU4P backend capture path.
options v4l2loopback devices=3 video_nr=55,60,61 card_label="OBS Virtual Camera,Surface Camera (front),Surface Camera (back)" exclusive_caps=1,1,1
