# Surface Pro 7 (non-plus) IPU4P camera stack.
#
# Firmware/CSS version validation is strict by default. The kernel driver has
# a built-in, warning-emitting quirk for only the signed 2019-10-30 CPD on the
# Surface Pro 7's IPU4P hardware with the 2018-12-22 CSS library.

# The IPU4P driver automatically applies the validated source-7 receiver
# timing quirk for the Surface Pro 7 front sensor; no timing option is needed.

# Keep the CSI-2 receiver settle values at the driver-calculated defaults.
# Fixed 1400/880 values can make libcamera stream starts fail with DPHY
# synchronization errors on this unit.

# No options or deny rules are required. The PCI modalias and the driver's
# module soft-dependencies load the complete stack through normal udev/modprobe
# handling.
