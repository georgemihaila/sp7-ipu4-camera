# Surface Pro 7 (non-plus) IPU4P camera stack.
#
# The 2019-10-30 IPU4P firmware has a structural version mismatch with the
# driver's 2018-12-22 CSS library, so the driver's version gate must be off.
options intel_ipu4p fw_version_check=0

# Surface Pro 7 front sensor (OV5693, CSI source 7) needs the receiver timing
# slots used by Windows. Without this, the sensor streams but CSI-2 reports
# DPHY/frame-sync errors and applications receive an all-black frame.
options intel_ipu4p_isys windows_source7_mipi_timing=1

# Keep the CSI-2 receiver settle values at the driver-calculated defaults.
# Fixed 1400/880 values can make libcamera stream starts fail with DPHY
# synchronization errors on this unit.

# Load the stack deliberately after boot, after firmware authentication has
# had time to settle; avoid udev's v4l_id probe storm during module loading.
blacklist intel_ipu4p
blacklist intel_ipu4p_isys
blacklist intel_ipu4p_psys
blacklist intel_ipu4p_isys_csslib
blacklist intel_ipu4p_psys_csslib
blacklist ipu_bridge
