# OPTIONAL NATIVE PIPEWIRE PROFILE: Surface Pro 7 IPU4 cameras.
#
# This file is intentionally not installed by the default bridge installer.
# Activate it only for native PipeWire qualification, after removing or
# disabling the bridge profile 50-sp7-ipu4.conf in the same configuration
# directory. WirePlumber merges configuration fragments; leaving the bridge
# profile active would still disable the physical libcamera monitor.
#
# Hide only the raw/debug V4L2 device family. The physical cameras remain
# available through WirePlumber's libcamera monitor as Video/Source nodes.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.*intel-ipu60.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

wireplumber.profiles = {
  main = {
    monitor.libcamera = enabled
  }
}
