# Surface Pro 7 IPU4: hide the ~55 raw V4L2 capture nodes the driver
# exposes from PipeWire enumeration. PipeWire apps get the cameras through
# WirePlumber's libcamera monitor
# instead (simple pipeline + software ISP does the debayering); the raw
# nodes are useless to apps and opening them concurrently breaks
# captures.
#
# Install to /etc/wireplumber/wireplumber.conf.d/
# NB: match on device.name (udev bus path), not api.v4l2.cap.* — the
# cap properties are only filled in after the rules run.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.*intel-ipu60.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# WirePlumber's libcamera nodes otherwise keep a V4L2 backend open even while
# they are suspended.  The named camera bridge opens the backend directly when
# a loopback endpoint is selected, so let the libcamera node release it while
# idle.
monitor.libcamera.rules = [
  {
    matches = [
      { node.name = "~libcamera_input.*" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
      }
    }
  }
]
