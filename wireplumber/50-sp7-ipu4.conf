# Surface Pro 7 IPU4: hide the ~55 raw V4L2 capture nodes the driver exposes
# from PipeWire enumeration. Camera apps use the named V4L2 loopbacks owned by
# the C bridge; exposing the raw nodes or direct libcamera devices creates
# competing owners for the shared IPU4 backend.
#
# Install to /etc/wireplumber/wireplumber.conf.d/
# NB: match on device.name (udev bus path), not api.v4l2.cap.* — the
# cap properties are only filled in after the rules run.
monitor.v4l2.rules = [
  {
    matches = [
      { device.name = "~v4l2_device.*intel-ipu60.*" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      { api.v4l2.path = "/dev/video60" }
      { api.v4l2.path = "/dev/video61" }
    ]
    actions = {
      update-props = {
        node.pause-on-idle = true
      }
    }
  }
]

# Do not create physical libcamera devices in PipeWire. The named camera
# bridge opens the selected physical sensor directly when a loopback endpoint
# is consumed and publishes the processed frames through that loopback.
monitor.libcamera.rules = [
  {
    matches = [
      { device.api = "libcamera" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]

# The physical libcamera monitor opens the IPU4 backend even when all of its
# devices and nodes are disabled above. Disable the feature itself so that
# WirePlumber keeps serving the bridge's V4L2 loopbacks without owning the raw
# IPU4 capture node.
wireplumber.profiles = {
  main = {
    monitor.libcamera = disabled
  }
}
