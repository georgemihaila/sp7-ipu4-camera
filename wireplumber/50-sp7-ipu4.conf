# Surface Pro 7 IPU4: hide the ~55 raw V4L2 capture nodes the driver exposes
# from PipeWire. Camera apps use the named V4L2 loopbacks owned by the C
# bridge; exposing the raw nodes or direct libcamera devices creates competing
# owners for the shared IPU4 backend.
#
# Install to /etc/wireplumber/wireplumber.conf.d/
# Match the generated node name. A device.disabled rule on this WirePlumber
# release suppresses publication of every V4L2 node, including loopbacks, so
# hide only the raw IPU4 nodes at the node stage.
monitor.v4l2.rules = [
  {
    matches = [
      { node.name = "~v4l2_input.*intel-ipu60.*" }
    ]
    actions = {
      update-props = {
        node.disabled = true
      }
    }
  }
]

# Do not create physical libcamera devices in PipeWire. The named camera
# bridge opens the selected physical sensor directly when a loopback endpoint
# is consumed and publishes the processed frames through that loopback.
monitor.libcamera.rules = [
  {
    matches = [
      { device.api = "libcamera" }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
